<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#brandGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Academic Cap / FAD Academy Emblem -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Mortarboard Top diamond -->
    <path d="M 32 15 L 52 23 L 32 31 L 12 23 Z" />
    
    <!-- Skullcap curve underneath -->
    <path d="M 20 28.5 L 20 37 C 20 42 44 42 44 37 L 44 28.5 C 40.5 31 35.8 32.2 32 32.2 C 28.2 32.2 23.5 31 20 28.5 Z" />
    
    <!-- Tassel Ribbon & Accent Badge -->
    <path d="M 48 23.5 L 48 35.5 C 47 37 45.5 38 45.5 40" fill="none" stroke="#fcd34d" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="45.5" cy="41" r="2.2" fill="#fcd34d" />
  </g>

  <!-- Telemetry / Live Play Indicator dot -->
  <circle cx="32" cy="49" r="3.5" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="1.2" />
</svg>